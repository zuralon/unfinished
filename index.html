<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXEL-OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{user-select:none;background:#000}
body.nocursor,body.nocursor *{cursor:none!important}
#dot{position:fixed;left:0;top:0;width:9px;height:9px;border-radius:50%;background:#fff;mix-blend-mode:difference;pointer-events:none;z-index:999999;display:none}
body.nocursor #dot{display:block}
.fx{position:fixed;pointer-events:none;animation:fx .7s ease-out forwards;white-space:nowrap;z-index:99998;font:bold 13px ui-monospace,monospace}
@keyframes fx{to{transform:translateY(-30px);opacity:0}}
body.noanim .fx{display:none}

/* ---------- era 0: terminal ---------- */
#term{display:none;position:fixed;inset:0;padding:24px 40px;color:#3dff7a;background:#041004;font:21px/1.2 'VT323',ui-monospace,Consolas,monospace;text-shadow:0 0 6px rgba(61,255,122,.55);overflow:hidden}
body.e0 #term{display:block}
#term:after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55))}
body:not(.noanim) #term{animation:flk 4s infinite}
@keyframes flk{0%,96%,100%{opacity:1}97%{opacity:.92}98%{opacity:1}99%{opacity:.95}}
body.e0 .fx{color:#3dff7a;font:20px 'VT323',monospace}
.sep{opacity:.6;overflow:hidden;white-space:nowrap}
#tGrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:36px;margin-top:8px}
#tScreen{position:relative;height:150px;border:2px solid #3dff7a;box-shadow:0 0 10px rgba(61,255,122,.35) inset;margin-bottom:12px}
#tBlock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:inherit;color:inherit;background:none;border:0;padding:4px 10px;cursor:pointer;line-height:.9;font-size:30px;text-shadow:inherit}
#tBlock:active{transform:translate(-50%,-50%) scale(.92)}
#tHint{position:absolute;left:0;right:0;bottom:4px;text-align:center;opacity:.7;font-size:18px;pointer-events:none}
#tStray{position:absolute;display:none;font:inherit;color:inherit;background:none;border:0;padding:4px;cursor:pointer;animation:blink .5s steps(1) infinite;text-shadow:inherit}
#tStray.on{display:block}
@keyframes blink{50%{opacity:0}}
.tl{cursor:pointer;padding:0 6px;width:fit-content;max-width:100%}
.tl:hover{background:#3dff7a;color:#041004;text-shadow:none}
.tl.off{opacity:.5;cursor:default}
.tl.off:hover{background:none;color:inherit;text-shadow:inherit}
.tl b{font-weight:normal;opacity:.75}
#tLog div{margin-bottom:6px}
#tLog .new{animation:typ .7s steps(40) both}
@keyframes typ{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
#tSys{position:absolute;left:40px;bottom:18px;display:flex;gap:4px;opacity:.75;font-size:18px}
.hk{display:flex;gap:26px;margin:6px 0}
.hk div{white-space:pre}
.hw{cursor:pointer}
.hw:hover{background:#3dff7a;color:#041004;text-shadow:none}
.e1 .hk{font:12px/1.3 ui-monospace,Consolas,monospace;gap:14px}
.e1 .hw:hover,.e1 .tl:hover{background:#000;color:#fff;text-shadow:none}

/* ---------- era 1: PIXEL-OS 1 desktop ---------- */
#desk{display:none;position:fixed;inset:0;font:bold 12px/1.35 ui-monospace,Consolas,monospace;color:#000;background:#fff repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/4px 4px}
body.e1 #desk{display:block}
body.cga #desk{background:#000 repeating-conic-gradient(#000 0 25%,#0aa 0 50%) 0 0/4px 4px}
#bar{position:fixed;top:0;left:0;right:0;height:24px;background:#fff;border-bottom:2px solid #000;display:flex;align-items:center;padding:0 8px;z-index:100000}
#bar .m{padding:2px 10px;cursor:pointer}
#bar .m.on,#bar .m:hover{background:#000;color:#fff}
#bar .logo{width:12px;height:12px;background:#000;margin:0 8px 0 2px}
body.cga #bar .logo{background:#f5f}
#bar .r{margin-left:auto;padding-right:6px}
#drop{position:fixed;display:none;background:#fff;border:2px solid #000;box-shadow:3px 3px 0 #000;z-index:100001;min-width:220px;padding:2px 0;font:bold 12px/1.35 ui-monospace,Consolas,monospace}
#drop.on{display:block}
.mi{padding:3px 14px;cursor:pointer;white-space:nowrap}
.mi:hover{background:#000;color:#fff}
.mi.dis{opacity:.4;cursor:default}
.mi.dis:hover{background:none;color:#000}
.mi.sepi{border-top:1px dotted #000;margin-top:3px;padding-top:5px}
#icons{position:fixed;left:12px;top:40px;bottom:46px;display:flex;flex-direction:column;flex-wrap:wrap;gap:12px;z-index:5}
.ic{width:84px;text-align:center;cursor:pointer}
.ic i{display:block;width:34px;height:30px;margin:0 auto 4px;border:2px solid #000;box-shadow:2px 2px 0 #000}
.ic span{background:#fff;padding:0 3px}
.p0{background:#000}
.p1{background:#fff repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/4px 4px}
.p2{background:repeating-linear-gradient(45deg,#000 0 2px,#fff 2px 4px)}
body.cga .p0{background:#5ff}
body.cga .p1{background:#f5f}
body.cga .p2{background:#fff}
.win{position:absolute;background:#fff;border:2px solid #000;box-shadow:4px 4px 0 #000}
.title{display:flex;align-items:center;gap:6px;padding:3px 4px;border-bottom:2px solid #000;background:repeating-linear-gradient(#000 0 1px,#fff 1px 3px);cursor:grab}
body.cga .title{background:repeating-linear-gradient(#f5f 0 1px,#fff 1px 3px)}
.title b{background:#fff;padding:0 6px;margin:0 auto}
.title.blink b{animation:blink .5s steps(1) 6}
.x{width:18px;height:16px;border:2px solid #000;background:#fff;font:bold 11px/1 monospace;padding:0;cursor:pointer;flex:none}
.body{padding:10px;max-height:calc(100vh - 140px);overflow-y:auto}
#w-game{width:260px}
#w-game .body{padding:0}
#pix{display:block;width:100%;height:150px;border:0;background:#fff;cursor:pointer;position:relative;padding:0}
#pix i{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;background:#000}
#pix:active i{transform:scale(.8)}
body.cga #pix i{background:#f5f}
#w-install{width:350px}
#w-install .body{max-height:min(520px,calc(100vh - 140px))}
#w-notes,#w-help,#w-trophy,#w-hack{width:330px}
#w-notes .body,#w-trophy .body{max-height:300px}
#w-score,#w-clock{width:190px}
.win.mid{width:240px}
.big{font-size:26px;text-align:center}
.c{text-align:center}
.dim{opacity:.6;font-weight:normal}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dotted #000}
.row small{display:block;font-weight:normal;opacity:.75}
.row.can .btn{background:#000;color:#fff}
.row.got{opacity:.45}
.btn{font:inherit;border:2px solid #000;background:#fff;color:#000;cursor:pointer;padding:2px 7px;white-space:nowrap}
.btn:hover{background:#000;color:#fff}
.tabs{display:flex;gap:4px;margin-bottom:6px}
.tabs .btn.on{background:#000;color:#fff}
.h{margin:10px 0 2px;opacity:.6}
.notes p{margin:0 0 8px;font-weight:normal}
.notes p:first-child{font-weight:bold}
.pal{display:flex;gap:4px;justify-content:center;margin:8px 0}
.pal i{width:28px;height:28px;border:2px solid #000}
.grid{display:flex;flex-wrap:wrap;gap:2px;margin:6px 0}
.grid i{width:12px;height:12px;border:1px solid #000}
.grid i.f{background:repeating-linear-gradient(45deg,#000 0 2px,#fff 2px 4px)}
.grid i.u{background:#000}
#task{position:fixed;left:0;right:0;bottom:0;height:34px;background:#fff;border-top:2px solid #000;display:flex;align-items:center;gap:10px;padding:0 12px;z-index:100000}
#ram{display:flex;gap:1px;flex-wrap:nowrap;max-width:60vw;overflow:hidden}
#ram i{width:9px;height:18px;border:1px solid #000}
#ram i.f{background:repeating-linear-gradient(45deg,#000 0 1px,#fff 1px 3px);opacity:.6}
#task .r{margin-left:auto}
#task span{white-space:nowrap}
.meter{margin-left:10px;padding:1px 6px;border:1px solid currentColor}
.meter.over{background:#000;color:#fff}
#stray{position:fixed;width:10px;height:10px;border:0;padding:0;background:#777;cursor:pointer;z-index:99999;display:none}
#stray.on{display:block}
body.cga #stray.good{background:#5ff;box-shadow:0 0 10px #5ff}
body.cga #stray.bad{background:#f5f;box-shadow:0 0 10px #f5f}
#toast{position:fixed;right:14px;bottom:46px;z-index:100002;display:none;padding:8px 12px;max-width:340px}
#toast.on{display:block}
#dlg{position:fixed;inset:0;display:none;z-index:200000;align-items:center;justify-content:center;background:rgba(0,0,0,.15);font:bold 12px/1.35 ui-monospace,Consolas,monospace}
#dlg.on{display:flex}
#dlg .win{position:relative;width:min(460px,92vw)}
#dlgT{white-space:pre-line;font-weight:normal;margin-bottom:12px}
#dlg textarea{width:100%;height:90px;font:11px monospace;margin-bottom:10px;display:none}
#dlg.inp textarea{display:block}
#dlgB{display:flex;gap:8px;justify-content:flex-end}
body.e0 #dlg .win{background:#041004;color:#3dff7a;border-color:#3dff7a;box-shadow:none;font:20px/1.2 'VT323',monospace}
body.e0 #dlg .title{display:none}
body.e0 #dlg .btn{background:none;color:#3dff7a;border-color:#3dff7a;font:inherit}
body.e0 #dlg textarea{background:#000;color:#3dff7a;border:1px solid #3dff7a}
#saver{position:fixed;inset:0;background:#000;z-index:150000;display:none;pointer-events:none;color:#fff;font:bold 14px ui-monospace,monospace}
#saver.on{display:block}
#saver i{position:absolute;width:8px;height:8px;background:#fff;animation:fly 7s linear infinite}
body.cga #saver i:nth-child(odd){background:#5ff}
body.cga #saver i:nth-child(even){background:#f5f}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(40vw,30vh)}50%{transform:translate(10vw,60vh)}75%{transform:translate(-30vw,20vh)}100%{transform:translate(0,0)}}
#saver span{position:absolute;left:50%;bottom:30px;transform:translateX(-50%)}
#saver canvas{position:absolute;inset:0;width:100%;height:100%}
#saver[data-k="5"]{left:calc(50% - var(--pw)/2);top:calc(50% - var(--ph)/2);width:var(--pw);height:var(--ph);right:auto;bottom:auto;background:radial-gradient(circle at 50% 60%,#13305e,#000 70%);font:13px Helvetica,Arial,sans-serif}
#saver[data-k="5"]:after{content:'';position:absolute;inset:0;background:rgba(255,145,30,.22);pointer-events:none}
#saver .lock{position:absolute;left:0;right:0;top:0;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(rgba(255,255,255,.18),rgba(0,0,0,.55) 55%,rgba(0,0,0,.7));border-bottom:1px solid rgba(255,255,255,.25)}
#saver .lt{font:200 58px/1 Helvetica,Arial,sans-serif;letter-spacing:1px}
#saver .ld{font:bold 13px Helvetica,Arial,sans-serif;margin-top:4px}
#saver .unl{position:absolute;left:0;right:0;bottom:0;height:96px;background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.55) 45%,rgba(255,255,255,.14));border-top:1px solid rgba(255,255,255,.25)}
#saver .unl i{position:absolute;left:22px;top:28px;width:62px;height:40px;border-radius:8px;background:linear-gradient(#fdfdfd,#c9c9c9);box-shadow:0 1px 3px #000}
#saver .unl i:after{content:'';position:absolute;left:20px;top:12px;border:8px solid transparent;border-left:14px solid #8a8a8a}
#saver .unl span{position:absolute;left:92px;right:10px;top:39px;text-align:center;white-space:nowrap;font:16px Helvetica,Arial,sans-serif;color:transparent;background:linear-gradient(90deg,#555 0 40%,#fff 50%,#555 60% 100%) 0 0/300% 100%;-webkit-background-clip:text;background-clip:text;animation:shine 2.4s linear infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:-100% 0}}
#saver[data-k="6"]{background:radial-gradient(ellipse at 60% 60%,#16305f,#060b18 70%);font:14px 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif}
#saver .focus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:300px;display:flex;flex-direction:column;align-items:center;text-align:center}
#saver .focus svg{flex:none;display:block;width:220px;height:220px;transform:rotate(-90deg)}
#saver .focus circle{fill:none;stroke-width:6}
#saver .focus .tr{stroke:rgba(255,255,255,.12)}
#saver .focus .pr{stroke:#60cdff;stroke-linecap:round;stroke-dasharray:326.7}
#saver .focus .ft{position:absolute;left:0;right:0;top:82px;font:600 44px 'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif}
#saver .focus span{position:static;transform:none;display:block;margin-top:24px;font-size:18px}
#saver .unl i{animation:none}
#saver .unl span{transform:none;bottom:auto}
#saver .unl:before{content:'';position:absolute;left:16px;right:16px;top:24px;height:48px;border-radius:11px;background:rgba(0,0,0,.6);box-shadow:inset 0 1px 3px #000,0 1px 0 rgba(255,255,255,.18)}
#saver .focus small{display:block;margin-top:6px;color:#9fb3c8}
#boot{position:fixed;inset:0;background:#fff repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/4px 4px;z-index:250000;display:none;align-items:center;justify-content:center}
#boot.on{display:flex}
#boot div{background:#fff;border:2px solid #000;box-shadow:4px 4px 0 #000;padding:26px 40px;text-align:center;font:bold 14px ui-monospace,monospace}
#boot i{display:block;width:16px;height:16px;background:#000;margin:0 auto 14px}
.prog{height:12px;border:2px solid currentColor;margin:4px 0 8px}
.prog i{display:block;height:100%;background:currentColor}
pre.vir{margin:0 0 6px;font:bold 14px monospace;text-align:center}

/* ---------- era 2: MINO-DOS ---------- */
body.s2 #desk{background:#0000a8 repeating-conic-gradient(#0000a8 0 25%,#00008a 0 50%) 0 0/4px 4px;font:19px/1.1 'VT323',ui-monospace,monospace}
body.s2 #bar{background:#aaa;border-bottom:0;height:26px}
body.s2 #bar .m.on,body.s2 #bar .m:hover{background:#000;color:#aaa}
body.s2 #bar .logo{background:#a00}
body.s2 #drop,body.s2 #dlg,body.s2 #toast{font:19px/1.1 'VT323',ui-monospace,monospace}
body.s2 #drop{background:#aaa;border:3px double #000;box-shadow:6px 6px 0 #000}
body.s2 .win{background:#aaa;border:3px double #fff;box-shadow:8px 8px 0 #000;color:#000}
body.s2 .title{background:#00aaaa;border-bottom:0}
body.s2 .title b{background:none;color:#fff;text-shadow:1px 1px 0 #000}
body.s2 .x{background:#aaa;border:0;color:#000;width:auto;padding:0 3px;font:19px 'VT323',monospace}
body.s2 .x:before{content:'[';}
body.s2 .x:after{content:']';}
body.s2 .btn{background:#00aa00;color:#000;border:0;box-shadow:3px 3px 0 #000;padding:1px 8px}
body.s2 .btn:hover,body.s2 .tabs .btn.on{background:#55ff55;color:#000}
body.s2 .row.can .btn{background:#ffff55;color:#000}
body.s2 .row{border-bottom:1px dashed #555}
body.s2 .row small{font-size:17px}
body.s2 #task{background:#aaa;border-top:0;height:34px}
body.s2 .p0{background:#55ff55}
body.s2 .p1{background:#ff55ff}
body.s2 .p2{background:#ffff55}
body.s2 #ram i{border-color:#000}
body.s2 .ic i{border:0;box-shadow:4px 4px 0 #000}
body.s2 .ic span{background:#0000a8;color:#fff}
body.s2 #pix{background:#000}
body.s2 #pix i{background:#55ffff}
body.s2 #stray.good{background:#55ff55;box-shadow:0 0 10px #55ff55}
body.s2 #stray.bad{background:#ff5555;box-shadow:0 0 10px #ff5555}
body.s2 .prog{border-color:#000}
body.s2 .prog i{background:#0000a8}
body.s2 #w-virus{background:#a00;color:#fff}
body.s2 #w-virus .title{background:#ff5555}
body.s2 .grid i.u{background:#0000a8}
body.s2 .e1 .hw:hover{background:#0000a8;color:#fff}
body.s2 #boot{background:#000}
body.s2 #boot div{background:#0000a8;color:#fff;border:3px double #fff;font:22px 'VT323',monospace}
body.s2 #boot i{background:#55ffff}
/* ---------- era 3: Winbows 95 ---------- */
body.s3 #desk,body.s3 #drop,body.s3 #dlg,body.s3 #toast{font:12px/1.35 Tahoma,Verdana,'Segoe UI',sans-serif}
body.s3 #desk{background:#008080}
body.s3 #bar,body.s4 #bar,body.s6 #bar{display:none}
body.s3 #icons{top:14px}
body.s3 .win,body.s3 #drop{background:#c0c0c0;border:2px solid;border-color:#dfdfdf #404040 #404040 #dfdfdf;box-shadow:1px 1px 0 #000;color:#000}
body.s3 .title{background:linear-gradient(90deg,#000080,#1084d0);border:0;margin:2px;padding:2px 3px;color:#fff}
body.s3 .title b{background:none;margin:0 auto 0 2px;font-weight:bold}
body.s3 .x{order:2;width:16px;height:14px;background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;color:#000;font:bold 10px/1 Tahoma,sans-serif}
body.s3 .btn,body.s3 #task .sb{background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;color:#000;padding:2px 8px}
body.s3 .btn:hover{background:#d4d0c8;color:#000}
body.s3 .btn:active,body.s3 .tabs .btn.on{border-color:#404040 #fff #fff #404040;background:#d4d0c8;color:#000}
body.s3 .row.can .btn{font-weight:bold;color:#000080;background:#c0c0c0}
body.s3 .row{border-bottom:1px solid #a0a0a0}
body.s3 #task{background:#c0c0c0;border-top:2px solid #fff;height:32px}
body.s3 #task .sb{font-weight:bold;display:flex;align-items:center;gap:5px;cursor:pointer}
body.s3 #task .sb i{width:16px;height:14px;background:conic-gradient(#f00 0 25%,#0a0 0 50%,#ff0 0 75%,#00f 0)}
body.s3 #task .sb.on{border-color:#404040 #fff #fff #404040}
body.s3 #drop{border-left:24px solid #000080;min-width:200px}
body.s3 .mi:hover{background:#000080;color:#fff}
body.s3 #clk{border:1px solid;border-color:#808080 #fff #fff #808080;padding:2px 8px}
body.s3 .p0{background:#000080}
body.s3 .p1{background:#008080}
body.s3 .p2{background:#800080}
body.s3 #ram i{border-color:#404040}
body.s3 .ic i{border:0;box-shadow:none;width:32px;height:32px}
body.s3 .ic span{background:none;color:#fff}
body.s3 #pix{background:#fff}
body.s3 #pix i{background:#000080}
body.s3 .meter.over,body.s4 .meter.over{background:#c00;color:#fff}
body.s3 #stray.good,body.s4 #stray.good{background:#0c0;box-shadow:0 0 10px #0f0}
body.s3 #stray.bad,body.s4 #stray.bad{background:#e00;box-shadow:0 0 10px #f00}
body.s3 #boot{background:#008080}
body.s3 #boot div{background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:none;font:bold 14px Tahoma,sans-serif}
body.s3 #boot i{background:conic-gradient(#f00 0 25%,#0a0 0 50%,#ff0 0 75%,#00f 0);width:40px;height:34px}
body.lag,body.lag *{cursor:wait!important}
.bipw{width:230px}
.bip .bub{background:#ffffe1;border:1px solid #000;border-radius:8px;padding:8px;margin-bottom:8px;font-weight:normal;position:relative}
.bip .bipme{width:26px;height:40px;margin:0 auto 8px;border:3px solid #555;border-radius:12px 12px 4px 4px;display:flex;gap:4px;justify-content:center;padding-top:8px}
.bip .bipme i{width:5px;height:5px;background:#000;border-radius:50%}
#bsod,#safe{position:fixed;inset:0;z-index:300000;display:none;white-space:pre-line;cursor:pointer;padding:12vh 10vw}
#bsod{background:#0000aa;color:#fff;font:20px/1.4 'VT323',monospace}
#safe{background:#000;color:#ff8c00;font:bold 26px/1.5 Tahoma,sans-serif;text-align:center;padding-top:35vh}
#bsod.on,#safe.on{display:block}
/* ---------- era 4: Winbows XD ---------- */
body.s4 #desk,body.s4 #drop,body.s4 #dlg,body.s4 #toast{font:12px/1.4 Tahoma,Verdana,'Segoe UI',sans-serif}
body.s4 #desk{background:radial-gradient(ellipse 90% 55% at 35% 105%,#5aa63a 0 60%,#3f8a2a 61%,transparent 62%),radial-gradient(ellipse 80% 40% at 90% 110%,#4c9a33 0 60%,transparent 61%),linear-gradient(#2f6fd6,#7fb2f0 55%,#cfe6ff)}
body.s4 #icons{top:14px}
body.s4 .win,body.s4 #drop{background:#ece9d8;border:3px solid #0831d9;border-top:0;border-radius:8px 8px 0 0;box-shadow:2px 3px 8px rgba(0,0,0,.45);color:#000}
body.s4 .title{background:linear-gradient(#0a5fe3,#3d95ff 10%,#0054e3 50%,#0047cc 90%,#003cbe);border:0;border-radius:6px 6px 0 0;padding:5px 6px;color:#fff;margin:0 -3px}
body.s4 .title b{background:none;margin:0 auto 0 4px;font:bold 13px Trebuchet MS,Tahoma,sans-serif;text-shadow:1px 1px 0 #0a246a}

body.s5.notch #home{top:calc(50% + var(--ph)/2 - 26px);width:120px;height:5px;padding:12px 0;box-sizing:content-box;background-clip:content-box;margin-left:-60px;transform:none;border:0;border-radius:3px;background-color:rgba(255,255,255,.85);box-shadow:none;cursor:ns-resize;touch-action:none;z-index:100004}
body.s5.notch:not(.apphome) #home{background-color:rgba(0,0,0,.75)}

body.s5.darkapp #w-game,body.s5.darkapp #w-game .body{background:#000}
/* under an open app the wallpaper would show as a light line at the rounded edges */
body.s5.notch:not(.apphome):not(.drag) #desk:after{background:#000}
body.s5.slab #desk:before{width:calc(var(--pw) + 48px);height:calc(var(--ph) + 48px);border-radius:40px}
/* the bezel is drawn over the screen like real glass: whatever is shown is cut exactly on the screen's curve */
/* iBrick terminal, the iOS way */

.ikey:active{background:#d1d1d6}
.ikey.off{color:#c7c7cc;text-decoration:line-through;box-shadow:none;background:#e5e5ea;cursor:default}
.igrp{margin:8px 10px;background:#fff;border-radius:10px;overflow:hidden}

.ichips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px}
.ichip{padding:4px 10px;border-radius:14px;background:#e9e9ff;color:#5856d6;font:600 13px ui-monospace,Menlo,Consolas,monospace;cursor:pointer}
.ichip.off{background:#f2f2f7;color:#c7c7cc;cursor:default}
body.s5.slab .ikeys{grid-template-columns:repeat(4,1fr)}
body.s5:not(.flat) .ikey{border-radius:6px;background:linear-gradient(#fff,#e6e6ea);box-shadow:0 1px 2px rgba(0,0,0,.4)}
body.s5:not(.flat) .ibtn{border-radius:8px;background:linear-gradient(#5a9cf8,#1f6fe0);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
/* iSlab multitasking: the ••• button, its menu, and the banner while picking the second app */
.mt,.mtm,#pickb{display:none}
body.s5.slab .win[id^="w-"] .title{position:relative}
body.s5.slab .mt{display:flex;gap:3px;position:absolute;left:50%;top:6px;transform:translateX(-50%);padding:4px 8px;cursor:pointer;z-index:3}
body.s5.slab .mt i{width:5px;height:5px;border-radius:50%;background:#8e8e93}
body.s5.slab .mtm:not(:empty){display:flex;flex-direction:column;position:absolute;left:50%;top:24px;transform:translateX(-50%);min-width:190px;background:rgba(255,255,255,.97);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.28);z-index:4;overflow:hidden;font:15px -apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif}

/* ---------- QUANTUM-OS (act 7): the Winbows 12 look, in two states at once ---------- */
body.s6.q7 #desk{background:radial-gradient(circle at 30% 35%,rgba(108,92,231,.55),transparent 45%),radial-gradient(circle at 72% 65%,rgba(0,206,201,.35),transparent 45%),radial-gradient(1px 1px at 12% 20%,#fff,transparent),radial-gradient(1px 1px at 82% 14%,#fff,transparent),radial-gradient(1.5px 1.5px at 64% 82%,#fff,transparent),radial-gradient(1px 1px at 38% 70%,#fff,transparent),radial-gradient(1px 1px at 90% 48%,#fff,transparent),linear-gradient(160deg,#0b0620,#1a0f3d 50%,#05020f);transition:transform .9s cubic-bezier(.6,-0.3,.4,1.3)}

/* ---------- the developer's post-it (all desktop eras) ---------- */
#postit{position:fixed;left:14px;bottom:52px;width:210px;z-index:99990;padding:8px 12px 10px;background:linear-gradient(#fff7a8,#fdeb71);color:#2d2a1f;font:600 19px/1.15 Caveat,'Segoe Print','Comic Sans MS',cursive;box-shadow:2px 6px 14px rgba(0,0,0,.35);transform:rotate(-2deg);transform-origin:top left;border-radius:1px 1px 18px 1px}
#postit:before{content:'';position:absolute;left:50%;top:-9px;width:70px;height:20px;margin-left:-35px;background:rgba(255,255,255,.45);transform:rotate(3deg)}
#postit p{margin:4px 0}
#postit .pt{display:flex;gap:6px;align-items:baseline;cursor:pointer;border-bottom:2px solid rgba(45,42,31,.35);padding-bottom:2px}
#postit .pt b{font-weight:700;font-size:22px}
#postit .pt span{margin-left:auto;font-size:15px;opacity:.6}
#postit .pd{opacity:.72;font-size:17px}
#postit .pb{color:#b3261e;font-weight:700}
#postit .pbar{height:7px;border:2px solid #2d2a1f;border-radius:3px;margin:6px 0 2px}
#postit .pbar i{display:block;height:100%;background:#2d2a1f}
#postit .go{font-weight:700;font-size:21px;color:#1d6b2a;cursor:pointer;animation:blink .8s steps(1) infinite}
#postit.ready{cursor:pointer;box-shadow:0 0 0 3px #1d6b2a,2px 6px 14px rgba(0,0,0,.35)}
body.noanim #postit .go{animation:none}
/* the post-it sits next to the device, never on its bezel: it narrows when the iSlab leaves little room */
body.s5 #postit{--piw:max(140px,min(210px,calc(50% - var(--pw)/2 - 64px)));width:var(--piw);box-sizing:border-box;left:max(10px,calc(50% - var(--pw)/2 - 40px - var(--piw)));bottom:auto;top:calc(50% - var(--ph)/2)}

.p3top{display:flex;align-items:center;gap:22px;padding:10px 18px;background:#0f1622;border-bottom:1px solid #1e2a3b}
.p3logo{display:flex;align-items:center;gap:8px}
.p3logo i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#40e0d0,#3a7bff);box-shadow:0 0 14px rgba(64,224,208,.45)}
.p3logo b{font:26px 'VT323',monospace;letter-spacing:2px;color:#fff}
.p3logo span{font-size:12px;color:#7f8ea3;border:1px solid #2a3a50;border-radius:10px;padding:1px 8px}
.p3game{display:flex;flex-direction:column;line-height:1.1;padding-left:18px;border-left:1px solid #1e2a3b}
.p3game b{font:22px 'VT323',monospace;color:#fff;letter-spacing:1px}
.p3game span{font-size:12px;color:#7f8ea3}
.p3kpis{flex:1;display:flex;justify-content:flex-end;gap:10px}
.p3kpi{background:#131c2b;border:1px solid #1e2a3b;border-radius:10px;padding:6px 14px;min-width:116px}
.p3kpi span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#7f8ea3}
.p3kpi b{display:flex;align-items:center;gap:6px;font-size:19px;color:#fff;font-weight:600;white-space:nowrap}
.p3kpi small{font-size:11px;color:#40e0d0}
.p3dot{width:9px;height:9px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 0 rgba(61,220,132,.6);animation:p3pulse 1.6s infinite}
.p3dot.red{background:#ff5a6e;animation:none}
@keyframes p3pulse{70%{box-shadow:0 0 0 7px rgba(61,220,132,0)}}
body.noanim .p3dot{animation:none}
.p3st{color:#3a4659;letter-spacing:-1px}
.p3st i{font-style:normal}.p3st i.f{color:#ffc93c}.p3st i.h{color:#a8872a}
.p3btn{font:inherit;color:#dfe7f2;background:#1a2433;border:1px solid #2a3a50;border-radius:8px;padding:7px 14px;cursor:pointer}
.p3btn:hover{background:#223047}
.p3btn.on{background:#40e0d0;border-color:#40e0d0;color:#06201d;font-weight:600}
.p3body{flex:1;display:grid;grid-template-columns:300px minmax(0,1fr) 360px;gap:14px;padding:14px;min-height:0}
.p3left,.p3right{min-height:0;overflow:auto}
.p3left{display:flex;flex-direction:column;gap:12px}
.p3card{background:#111a28;border:1px solid #1e2a3b;border-radius:12px;padding:12px}
.p3card h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:#7f8ea3;font-weight:600}
.p3ch{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.p3ch span{font-size:12px;color:#7f8ea3}
.p3act{position:relative;display:block;width:100%;text-align:left;font:inherit;color:#dfe7f2;background:#162132;border:1px solid #23324a;border-radius:9px;padding:8px 10px;margin-bottom:6px;cursor:pointer;overflow:hidden}
.p3act:hover{border-color:#40e0d0}
.p3act b{font-weight:600}
.p3act em{float:right;font-style:normal;color:#40e0d0;font-weight:600}
.p3act small{display:block;color:#8a98ac;font-size:12px}
.p3act.poor em{color:#ff8a98}
.p3act.cool{opacity:.6;cursor:default}
.p3act.cool em{color:#ffc93c}
.p3act.cool:hover{border-color:#23324a}
.p3cd{position:absolute;left:0;bottom:0;height:3px;background:#ffc93c}

.p3seg{display:flex;border:1px solid #23324a;border-radius:9px;overflow:hidden}
.p3seg button{flex:1;font:inherit;font-size:12px;color:#aab6c8;background:#162132;border:0;border-right:1px solid #23324a;padding:7px 2px;cursor:pointer}
.p3seg button:last-child{border-right:0}
.p3seg button.on{background:#40e0d0;color:#06201d;font-weight:700}
.p3dim{color:#7f8ea3;font-size:12px;margin:6px 0 0}
.p3row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;color:#dfe7f2;background:#162132;border:1px solid #23324a;border-radius:9px;padding:7px 10px;margin-bottom:6px;cursor:pointer}
.p3row:hover{border-color:#40e0d0}
.p3row>div{flex:1;min-width:0}
.p3row b{font-weight:600}
.p3row small{display:block;color:#8a98ac;font-size:12px}
.p3row em{font-style:normal;color:#40e0d0;font-weight:600;white-space:nowrap}
.p3row.poor em{color:#ff8a98}
.p3row.hot{border-color:#ff5a6e;box-shadow:0 0 0 1px #ff5a6e inset}
.p3row.done{opacity:.6;cursor:default}.p3row.done:hover,.p3row.lock:hover{border-color:#23324a}
.p3row.lock{opacity:.4;cursor:default}
.p3n{color:#7f8ea3;font-weight:400;font-size:12px}
.p3mid{display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0}
.p3mapc{flex:1.6;display:flex;flex-direction:column;min-height:0}
.p3mapc canvas{display:block;margin:10px auto;image-rendering:pixelated}
.p3chartc{flex:1;display:flex;flex-direction:column;min-height:150px}
.p3chartc canvas{display:block;margin-top:8px}
.p3red{color:#ff5a6e}.p3gold{color:#ffc93c}
.p3ch span b{color:#dfe7f2}
.p3ch span b.p3red{color:#ff5a6e}.p3ch span b.p3gold{color:#ffc93c}
.p3gbar{display:flex;align-items:center;gap:12px;font-size:13px;color:#aab6c8}
.p3gbar div{flex:1;height:8px;border-radius:4px;background:#1a2433;overflow:hidden}
.p3gbar i{display:block;height:100%;background:linear-gradient(90deg,#3a7bff,#40e0d0);transition:width .4s}
.p3right{display:flex;flex-direction:column;background:#111a28;border:1px solid #1e2a3b;border-radius:12px;overflow:hidden}
.p3tabs{display:flex;border-bottom:1px solid #1e2a3b}
.p3tabs button{flex:1;white-space:nowrap;font:inherit;font-size:13px;color:#8a98ac;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px;cursor:pointer}
.p3tabs button.on{color:#fff;border-bottom-color:#40e0d0}
.p3badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:#ff5a6e;color:#fff;font-size:11px;font-weight:700}
.p3badge.b{background:#3a7bff}
.p3pane{flex:1;overflow:auto;padding:12px}
.p3rsum{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.p3rsum b{font-size:30px;color:#fff;font-weight:600}
.p3rsum .p3st{font-size:18px}
.p3rsum small{color:#7f8ea3}
.p3dist{display:flex;align-items:center;gap:8px;font-size:11px;color:#7f8ea3;margin:2px 0}
.p3dist div{flex:1;height:5px;background:#1a2433;border-radius:3px;overflow:hidden}
.p3dist i{display:block;height:100%;background:#ffc93c}
.p3rev{background:#162132;border:1px solid #1e2a3b;border-left:3px solid #3ddc84;border-radius:8px;padding:8px 10px;margin-top:8px}
.p3rev.s3{border-left-color:#ffc93c}.p3rev.s2,.p3rev.s1{border-left-color:#ff5a6e}
.p3rh{display:flex;align-items:center;gap:8px}
.p3rh b{font-weight:600;font-size:13px}
.p3rh small{margin-left:auto;color:#7f8ea3;font-size:11px}
.p3rev p{margin:4px 0 0;color:#c5d0de}
.p3rev p.p3rep{color:#40e0d0;font-size:12px;padding-left:10px;border-left:2px solid #2a3a50}
.p3mini{font:inherit;font-size:12px;color:#dfe7f2;background:#1f2c40;border:1px solid #2a3a50;border-radius:7px;padding:4px 10px;margin-top:6px;cursor:pointer;white-space:nowrap}
.p3mini:hover{border-color:#40e0d0}
.p3mini.poor{color:#ff8a98}.p3mini.cool{opacity:.5}
.p3bug{display:block;width:100%;text-align:left;font:inherit;color:#dfe7f2;background:#162132;border:1px solid #23324a;border-radius:8px;padding:8px 10px;margin-top:8px;cursor:pointer}
.p3bug:hover{border-color:#ff5a6e}
.p3bug:active{transform:scale(.98)}
.p3bug b{font-size:11px;color:#7f8ea3;margin-left:6px}
.p3bug p{margin:3px 0 6px}
.p3sev{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;padding:1px 6px;border-radius:4px;background:#2a3a50;color:#aab6c8}
.p3bug.sev1 .p3sev{background:#5a4416;color:#ffc93c}.p3bug.sev2 .p3sev{background:#5a1622;color:#ff8a98}
.p3hp{height:4px;background:#1a2433;border-radius:2px;overflow:hidden}
.p3hp i{display:block;height:100%;background:#ff5a6e}
.p3patch{display:flex;align-items:center;gap:10px;background:#162132;border:1px solid #1e2a3b;border-radius:8px;padding:8px 10px;margin-bottom:8px}
.p3patch>div{flex:1}
.p3patch b{font-weight:600}
.p3patch small{display:block;color:#8a98ac;font-size:12px}
.p3patch.done{opacity:.6}.p3patch.lock{opacity:.4}
.p3ok{color:#3ddc84;font-size:12px;font-weight:600}
.p3msg{background:#162132;border-radius:8px;padding:8px 10px;margin-bottom:8px;border-left:3px solid #3ddc84;color:#c5d0de}
.p3msg b{display:block;font-size:11px;letter-spacing:1px;color:#3ddc84}
.p3msg.cop{border-left-color:#ff8a1f}.p3msg.cop b{color:#ff8a1f}
.p3msg.cat{border-left-color:#b45cff}.p3msg.cat b{color:#c88cff}
.p3msg.sys{border-left-color:#3a7bff}
#p3pan{display:none}
#p3pan.on{display:flex;position:fixed;inset:0;z-index:20;background:rgba(5,8,14,.4);align-items:flex-start;justify-content:flex-end;padding:62px 18px}
.p3menu{width:300px;background:#111a28;border:1px solid #2a3a50;border-radius:12px;padding:6px;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.p3mi{font:inherit;text-align:left;color:#dfe7f2;background:none;border:0;border-radius:7px;padding:8px 10px;cursor:pointer}
.p3mi:hover{background:#1a2433}
#p3end{display:none}
#p3end.on{display:flex;position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse at center,#0f2a33,#05080e 75%);align-items:center;justify-content:center;padding:24px;overflow:auto}
.p3et{max-width:780px;width:100%;font:22px/1.4 'VT323',monospace;color:#c5d0de}
.p3et>div{margin:6px 0;animation:p2in .5s ease-out}
.p3et .dev{color:#3ddc84}.p3et .cop{color:#ff9a3f}.p3et .cat{color:#c88cff}
.p3et .big{font-size:46px;color:#40e0d0;text-align:center;margin-bottom:18px}
.p3et pre{font:inherit;text-align:center;white-space:pre-wrap;color:#fff;margin:0}
.p3et .fb{display:flex;gap:12px;justify-content:center;margin-top:22px}
body.p3 .fx{color:#40e0d0;font:600 15px system-ui;text-shadow:0 1px 4px #000}
body.p3 #toast{background:#111a28;color:#dfe7f2;border:1px solid #2a3a50;border-left:3px solid #40e0d0;border-radius:10px;font:14px system-ui;bottom:18px;right:18px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
body.p3 #dlg{background:rgba(5,8,14,.6)}
body.p3 #dlg .win{background:#111a28;color:#dfe7f2;border:1px solid #2a3a50;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6);font:14px/1.4 system-ui;overflow:hidden}
body.p3 #dlg .title{background:#162132;color:#fff;padding:8px 12px;font:600 14px system-ui;border:0}
body.p3 #dlg .body{padding:14px}
body.p3 #dlg .btn{font:14px system-ui;color:#dfe7f2;background:#1f2c40;border:1px solid #2a3a50;border-radius:8px;padding:6px 14px}
@media (max-width:1250px){.p3body{grid-template-columns:260px minmax(0,1fr) 300px}.p3kpi{min-width:0;padding:6px 10px}}
@media (max-width:860px){.p3body{grid-template-columns:1fr;overflow:auto}.p3top{flex-wrap:wrap}.p3kpis{flex-wrap:wrap;justify-content:flex-start}}
</style>
